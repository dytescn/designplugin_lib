[package]
name = "plugin_lib"
version = "1.0.7"
edition = "2024"
description = "plugin_lib: design plugin data interface library"
license = "MIT"
publish = false

[lib]
name = "plugin_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-credential-types = "1.1.7"
aws-sdk-s3 = "1.139.0"
libloading = "0.8"
once_cell = "1"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
