[package]
name = "plugin_lib"
version = "1.0.16"
edition = "2024"
description = "plugin_lib: design plugin data interface library"
license = "MIT"
publish = false

[lib]
name = "plugin_lib"
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "0.8"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
